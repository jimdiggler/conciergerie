<header
  class="sticky top-0 z-[1000] flex h-11 w-full items-center justify-between bg-[rgba(245,240,232,0.9)] px-3 md:px-[22px] backdrop-blur-[20px] border-b border-[rgba(139,119,101,0.15)] font-sans"
>
  <div class="flex flex-none items-center mr-2 md:mr-5">
    <a href="#" class="flex items-center gap-1 md:gap-2 no-underline focus:outline-none">
      <img
        src="assets/logo_marron.png"
        alt="Lodge and Clean"
        class="h-7 md:h-9 w-auto mr-1 md:mr-2 inline-block"
      />
      <span
        class="hidden sm:inline-block align-middle text-[14px] md:text-[16px] font-semibold tracking-[-0.5px] text-[#5a4a3a] transition-opacity duration-200 hover:opacity-80"

        Lodge and Clean
      </span>
    </a>
  </div>
