<!-- Header container (moved from app.html) -->
<header class="apple-header">
  <!-- Logo à gauche -->
  <div class="logo-container">
    <a href="#" class="logo-link">
      <img src="assets/logo_marron.png" alt="Lodge and Clean" class="logo-marron">
      <span class="business-title">Lodge and Clean</span>
    </a>
  </div>

  <!-- Menu au centre -->
  <nav class="menu-nav">
    <a class="menu-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Accueil</a>
    <a class="menu-link" routerLink="/concierge-service" routerLinkActive="active">Services conciergerie</a>
    <a class="menu-link">Locations</a>
    <a class="menu-link" routerLink="/contact" routerLinkActive="active">Contact</a>
  </nav>

  <!-- Right section (search, cart, etc) -->
  <div class="header-right">
    <button class="search-btn" aria-label="Rechercher">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M6.5 1C3.46 1 1 3.46 1 6.5s2.46 5.5 5.5 5.5c1.25 0 2.41-.45 3.31-1.2l4.07 4.07a.75.75 0 1 0 1.06-1.06l-4.07-4.07c.75-.9 1.2-2.06 1.2-3.31C12 3.46 9.54 1 6.5 1m0 1.5C8.97 2.5 10.5 4.03 10.5 6.5S8.97 10.5 6.5 10.5 2.5 8.97 2.5 6.5 4.03 2.5 6.5 2.5"/>
      </svg>
    </button>
  </div>
</header>
