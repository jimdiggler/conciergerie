<div class="mx-auto mt-12 md:mt-20 max-w-5xl px-4 md:px-6 py-6 md:py-10 font-sans text-[#2b241f]">
  <div class="mb-10 md:mb-16 text-center">
    <h1
      class="mb-3 md:mb-4 text-[28px] md:text-4xl font-bold leading-snug tracking-tight text-[#2b241f]"
    >
      Exemple de logements accompagnés
    </h1>
    <p class="mx-auto max-w-2xl text-[15px] md:text-base leading-relaxed text-[#7a6a5a] px-2">
      Nous intervenons sur des logements confiés par leurs propriétaires afin d’assurer un accueil
      soigné, un séjour confortable et un suivi professionnel.
    </p>
  </div>

  <div class="grid gap-4 md:gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 mb-6 md:mb-10">
    @for (picture of pictures; track picture.id) {
      <div
        class="relative overflow-hidden rounded-xl bg-[#f5f1e8] shadow-md transition-transform transition-shadow duration-300 hover:-translate-y-1 hover:shadow-xl"
      >
        <img
          [src]="picture.src"
          [alt]="picture.alt"
          class="block h-60 md:h-72 lg:h-60 w-full bg-gradient-to-br from-[#f5f1e8] to-[#e8dcc7] object-cover"
        />
        @if (picture.caption) {
          <p class="m-0 bg-white px-4 py-3 text-center text-sm font-medium text-[#5a4a3a]">
            {{ picture.caption }}
          </p>
        }
      </div>
    }
  </div>
</div>
